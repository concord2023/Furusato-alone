<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>読み取りDB</title><link rel="stylesheet" href="style.css"><style>
.menu{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:8px}.menu a{white-space:nowrap;text-decoration:none;padding:9px 12px;border-radius:10px;background:#f1f5f9;color:#334155;font-size:13px}.menu a.active{background:#111827;color:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{padding:9px;border:1px solid #d1d5db;border-radius:9px;background:#fff}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric{background:#f8fafc;border-radius:10px;padding:10px}.metric b{display:block;font-size:20px}.small{font-size:12px;color:#64748b}.dbrow{border-top:1px solid #e5e7eb;padding:10px 0}.dbrow summary{cursor:pointer}.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2ff;font-size:12px}.warn{color:#b45309}.ok{color:#047857}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:10px;padding:10px;font-size:11px;max-height:520px;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{border:1px solid #b91c1c!important;color:#b91c1c!important;background:#fff!important}
@media(max-width:600px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><div><a href="index.html" class="back">← ホーム</a><strong>読み取りDB</strong></div></header><main>
<nav class="menu"><a href="index.html">ホーム</a><a href="details.html">上限詳細</a><a href="donations.html">寄附・配送</a><a href="request.html">依頼</a><a class="active" href="database.html">読み取りDB</a><a href="settings.html">設定</a></nav>
<section class="card"><h2>🗄️ すべての読み取り結果</h2><p class="small">給与・賞与・源泉徴収票など、資料から読み取って保存したデータを年度画面から切り離して一覧します。ここは「保存されているデータそのもの」を確認する場所です。</p><div id="metrics" class="metrics"></div></section>
<section class="card"><h2>🔎 絞り込み</h2><div class="filters"><input id="q" placeholder="資料名・年・月・項目を検索"><select id="kind"><option value="">すべて</option><option value="salary">給与</option><option value="bonus">賞与</option><option value="withholding">源泉徴収票</option></select><select id="year"><option value="">すべての年度</option></select></div></section>
<section class="card"><div class="actions"><button id="exportDb">読み取りDBを書き出す</button><button id="exportBackup">DB＋手動入力をバックアップ</button><button id="refresh" class="secondary">再読み込み</button><button id="clearReadResults" class="danger">読み取り結果だけをクリア</button></div><p class="small">「読み取り結果だけをクリア」では、手動入力・手動調整・設定は消去しません。</p><div id="message" class="small"></div></section>
<section class="card"><h2>📚 データ一覧</h2><div id="list"></div></section>
<section class="card"><h2>🧾 操作ログ</h2><div id="logs"></div></section>
</main>
<script>
const DB='furusatoStandaloneDB',DOCS='documents',LOGS='logs',META='meta';const $=id=>document.getElementById(id);const yen=n=>n==null||!Number.isFinite(Number(n))?'—':Math.round(Number(n)).toLocaleString('ja-JP')+'円';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,3);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(DOCS))db.createObjectStore(DOCS,{keyPath:'id'});if(!db.objectStoreNames.contains(LOGS))db.createObjectStore(LOGS,{keyPath:'id',autoIncrement:true});if(!db.objectStoreNames.contains(META))db.createObjectStore(META,{keyPath:'key'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return openDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(store,mode),s=t.objectStore(store);let out;try{out=fn(s)}catch(e){rej(e);return}t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)}))}
const allDocs=()=>tx(DOCS,'readonly',s=>new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));const allLogs=()=>tx(LOGS,'readonly',s=>new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kindLabel(k){return k==='salary'?'給与':k==='bonus'?'賞与':k==='withholding'?'源泉徴収票':k||'不明'}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let docs=[],logs=[];
function render(){const q=$('q').value.trim().toLowerCase(),kind=$('kind').value,year=$('year').value;const rows=docs.filter(d=>(!kind||d.kind===kind)&&(!year||String(d.year)===year)&&(!q||JSON.stringify(d).toLowerCase().includes(q))).sort((a,b)=>(b.year||0)-(a.year||0)||(b.month||0)-(a.month||0)||String(a.kind).localeCompare(String(b.kind)));const counts={salary:docs.filter(d=>d.kind==='salary').length,bonus:docs.filter(d=>d.kind==='bonus').length,withholding:docs.filter(d=>d.kind==='withholding').length,review:docs.filter(d=>d.needsReview).length};$('metrics').innerHTML=`<div class="metric"><span>保存資料</span><b>${docs.length}</b></div><div class="metric"><span>給与</span><b>${counts.salary}</b></div><div class="metric"><span>賞与</span><b>${counts.bonus}</b></div><div class="metric"><span>源泉徴収票</span><b>${counts.withholding}</b></div>`;$('list').innerHTML=rows.length?rows.map(d=>`<details class="dbrow"><summary><b>${esc(d.year||'—')}年${d.month?esc(d.month)+'月 ':''}${esc(d.name||d.document||'資料')}</b>　<span class="pill">${kindLabel(d.kind)}</span>　${d.needsReview?'<span class="warn">要確認</span>':'<span class="ok">保存済み</span>'}</summary><div class="small" style="margin:7px 0">ID: ${esc(d.id)}　保存項目: ${Object.keys(d).length}項目</div><pre>${esc(JSON.stringify(d,null,2))}</pre></details>`).join(''):'<p class="small">該当する読み取り結果はありません。</p>'}
async function load(){docs=await allDocs();logs=await allLogs();const years=[...new Set(docs.map(d=>d.year).filter(Boolean))].sort((a,b)=>b-a);const old=$('year').value;$('year').innerHTML='<option value="">すべての年度</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)}年</option>`).join('');if(years.includes(Number(old)))$('year').value=old;render();$('logs').innerHTML=logs.slice().sort((a,b)=>String(b.time).localeCompare(String(a.time))).map(x=>`<details class="dbrow"><summary>${esc(x.msg||'ログ')}　<span class="small">${esc(x.time||'')}</span></summary><pre>${esc(JSON.stringify(x,null,2))}</pre></details>`).join('')||'<p class="small">操作ログはありません。</p>'}
$('q').oninput=render;$('kind').onchange=render;$('year').onchange=render;$('refresh').onclick=load;$('exportDb').onclick=()=>download('furusato_db.json',JSON.stringify({version:1,documents:docs},null,2));
$('exportBackup').onclick=async()=>{const db=await openDB();const manual=await new Promise((res,rej)=>{const t=db.transaction(META,'readonly'),r=t.objectStore(META).get('manual');r.onsuccess=()=>res(r.result?.value||{});r.onerror=()=>rej(r.error)});download('furusato_restore.json',JSON.stringify({version:1,documents:docs,manual},null,2))};
$('clearReadResults').onclick=async()=>{if(!confirm('給与・賞与・源泉徴収票などの読み取り結果だけを消去します。手動入力・手動調整・設定は消去しません。実行しますか？'))return;const db=await openDB();await new Promise((res,rej)=>{const t=db.transaction(DOCS,'readwrite');t.objectStore(DOCS).clear();t.oncomplete=res;t.onerror=()=>rej(t.error)});$('message').textContent='読み取り結果だけを消去しました。手動入力は保持されています。';await load()};load().catch(e=>{$('message').textContent='DBを読み込めません：'+e.message});
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js?build=20261004-v45').catch(()=>{});</script></body></html>
